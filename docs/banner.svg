<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Дорожка — журнал тренера по плаванию">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C6E91"/>
      <stop offset="1" stop-color="#084A63"/>
    </linearGradient>
    <!-- lane rope: alternating red and white floats, like the stripe at the top of the app -->
    <pattern id="rope" width="48" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="20" height="10" rx="5" fill="#DE4A30"/>
      <rect x="26" y="2" width="20" height="10" rx="5" fill="#EDF3F5"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#water)"/>
    <!-- light ripples -->
    <g fill="none" stroke="#EDF3F5" stroke-width="3" stroke-linecap="round" opacity=".10">
      <path d="M0 132c60-22 120-22 180 0s120 22 180 0 120-22 180 0 120 22 180 0 120-22 180 0 120 22 180 0 120-22 180 0"/>
      <path d="M0 236c60-22 120-22 180 0s120 22 180 0 120-22 180 0 120 22 180 0 120-22 180 0 120 22 180 0 120-22 180 0"/>
    </g>
    <rect x="0" y="22" width="1280" height="14" fill="url(#rope)"/>
    <rect x="0" y="324" width="1280" height="14" fill="url(#rope)"/>

    <!-- app icon -->
    <g transform="translate(96 98) scale(.32)">
      <rect width="512" height="512" rx="112" fill="#EDF3F5"/>
      <g stroke-width="26" stroke-linecap="round" fill="none">
        <path d="M96 200c40-28 80-28 120 0s80 28 120 0 80-28 100-14" stroke="#0A6383"/>
        <path d="M96 312c40-28 80-28 120 0s80 28 120 0 80-28 100-14" stroke="#0A6383" opacity=".5"/>
      </g>
      <g fill="#DE4A30"><circle cx="128" cy="408" r="22"/><circle cx="208" cy="408" r="22"/><circle cx="288" cy="408" r="22"/><circle cx="368" cy="408" r="22"/></g>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">
      <text x="300" y="176" font-size="88" font-weight="700" letter-spacing="-1">Дорожка</text>
      <text x="302" y="224" font-size="30" fill="#CFE3EA">журнал тренера по плаванию</text>
      <text x="302" y="270" font-size="21" fill="#9FC6D4" letter-spacing=".4">расписание · посещения · абонементы · оплаты · напоминания в Telegram</text>
    </g>
  </g>
</svg>
