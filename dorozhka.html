<meta charset="utf-8">
<title>Дорожка тренера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: sidebar + work area on desktop, header + bottom tabs on phone. The lane-rope stripe is the one bold motif. */
:root{
  --bg:#EDF3F5; --surface:#FFFFFF; --surface-2:#E2EBEE; --ink:#0D2230; --muted:#56707E; --line:#D0DDE2;
  --accent:#0A6383; --accent-ink:#FFFFFF; --rope:#DE4A30;
  --t-baby:#C96A22; --t-individual:#2C62C9; --t-group:#1E8A62; --t-split:#8645B5; --t-minigroup:#B23C77;
  --ok:#1D7F55; --warn:#9C6511; --bad:#BC3A26;
  --ok-bg:#DFF1E7; --warn-bg:#F8EBD3; --bad-bg:#F9E1DB;
  --scrim:rgba(8,24,33,.42);
  --shadow:0 1px 2px rgba(13,34,48,.06),0 10px 28px rgba(13,34,48,.08);
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09161C; --surface:#0F212A; --surface-2:#16303D; --ink:#E1ECF0; --muted:#8DA5B1; --line:#21404E;
  --accent:#4FB4D4; --accent-ink:#04202A; --rope:#FF6D51;
  --t-baby:#F0A05C; --t-individual:#7BA3F2; --t-group:#4FC895; --t-split:#C29AEE; --t-minigroup:#F08CBE;
  --ok:#55C990; --warn:#E5B55C; --bad:#FF7E66;
  --ok-bg:#12352A; --warn-bg:#382C12; --bad-bg:#3D1C16;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09161C; --surface:#0F212A; --surface-2:#16303D; --ink:#E1ECF0; --muted:#8DA5B1; --line:#21404E;
  --accent:#4FB4D4; --accent-ink:#04202A; --rope:#FF6D51;
  --t-baby:#F0A05C; --t-individual:#7BA3F2; --t-group:#4FC895; --t-split:#C29AEE; --t-minigroup:#F08CBE;
  --ok:#55C990; --warn:#E5B55C; --bad:#FF7E66;
  --ok-bg:#12352A; --warn-bg:#382C12; --bad-bg:#3D1C16;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.45rem}
h2{font-size:1.1rem}
h3{font-size:.95rem;font-weight:500}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rope{height:5px;background:repeating-linear-gradient(90deg,var(--rope) 0 16px,var(--surface) 16px 20px,var(--accent) 20px 36px,var(--surface) 36px 40px)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;flex-direction:column;gap:2px;padding:20px 20px 18px}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;padding:16px 20px 20px;border-top:1px solid var(--line)}
.topbar{display:none}
.tabbar{display:none}
main{padding-block:28px 48px;padding-inline:clamp(16px,3vw,40px);max-width:1200px;width:100%;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.page-head .sub{color:var(--muted);margin-top:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500;line-height:1.2;white-space:nowrap}
a.btn{color:var(--ink);text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.icon-btn{width:36px;height:36px;padding:0;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wdays label{position:relative;cursor:pointer;min-width:44px;text-align:center}.wdays input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.wdays label:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--bg)}.wdays label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pl-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}.pl-day{display:flex;align-items:center;gap:8px}.pl-day .inp{flex:1;min-width:0}.pl-day:not(:has(input:checked)) input[type=time]{visibility:hidden}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.durs{display:flex;flex-direction:column;gap:6px}.durs .inp{max-width:90px}.hrow .inp{width:auto;flex:1;min-width:0}.hrow:not(:has(input:checked)) input[type=time]{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600;white-space:nowrap;
  background:color-mix(in srgb,var(--tc,var(--muted)) 15%,transparent);color:color-mix(in srgb,var(--tc,var(--muted)) 78%,var(--ink))}
.t-baby{--tc:var(--t-baby)} .t-individual{--tc:var(--t-individual)} .t-group{--tc:var(--t-group)} .t-split{--tc:var(--t-split)} .t-minigroup{--tc:var(--t-minigroup)} .k-trial{--tc:var(--accent)} .k-makeup{--tc:var(--warn)}
.st-done{--tc:var(--ok)} .st-unmarked{--tc:var(--warn)} .st-live{--tc:var(--rope)} .st-planned{--tc:var(--muted)} .st-cancelled{--tc:var(--muted)} .st-paused{--tc:var(--muted)}
.blk.paused{opacity:.45}
.lv-ok{--tc:var(--ok)} .lv-warn{--tc:var(--warn)} .lv-bad{--tc:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tc,var(--muted));flex:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);font-weight:500;min-width:0}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;color:var(--ink);font-size:.95rem}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.next{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.next-in{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.next-time{font-family:var(--f-display);font-size:2.3rem;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.when{font-weight:600;color:var(--rope)}
.prev-note{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:.86rem}
.ava{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:600;background:var(--surface-2);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:20px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-weight:500;font-size:1.35rem;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.todo{list-style:none;margin:0;padding:6px}
.todo li{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:9px}
.todo li:hover{background:var(--surface-2)}
.todo .dot{margin-top:7px}
.todo .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.todo .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tl{list-style:none;margin:0;padding:6px}
.tl li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(62px,max-content) minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px;border-radius:9px;cursor:pointer}
.tl li button:hover{background:var(--surface-2)}
.tl li button:focus-visible{outline:2px solid var(--accent)}
.tl .t{font-family:var(--f-mono);font-size:.9rem}
.tl .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* schedule */
.wk-nav{display:flex;align-items:center;gap:6px}
.wk-title{font-family:var(--f-display);font-weight:500;font-size:1rem;min-width:170px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wgrid-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.wgrid{display:grid;grid-template-columns:52px repeat(7,minmax(108px,1fr));min-width:820px}
.wh{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line);padding:10px 8px;text-align:center;font-size:.85rem;color:var(--muted)}
.wh b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem;color:var(--ink)}
.wh.today b{color:var(--accent)}
.wh.today{box-shadow:inset 0 -3px 0 var(--accent)}
.hours{position:relative}
.hours span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.dcol{position:relative;border-left:1px solid var(--line);cursor:copy;
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.dcol.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.blk{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 7px;overflow:hidden;cursor:pointer;text-align:left;font-size:.78rem;line-height:1.25;
  border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 16%,var(--surface));color:var(--ink);display:flex;flex-direction:column;gap:1px}
.blk:hover{background:color-mix(in srgb,var(--tc) 26%,var(--surface))}
.blk .bt{font-family:var(--f-mono);font-size:.7rem;color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.blk .bn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.unmarked{border-style:dashed;border-color:var(--warn)}
.blk.cancelled{opacity:.45;text-decoration:line-through}
.blk .flag{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--rope);z-index:1;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--rope)}
.agenda{display:none}
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:14px}
.dstrip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;color:var(--muted)}
.dstrip button b{font-family:var(--f-display);font-weight:500;font-size:1rem;color:var(--ink)}
.dstrip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dstrip button[aria-pressed="true"] b{color:var(--bg)}
.dstrip .cnt{display:flex;gap:2px;height:5px}
.dstrip .cnt i{width:5px;height:5px;border-radius:50%;background:var(--tc)}

/* clients */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .inp{max-width:320px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ccard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ccard:focus-visible{outline:2px solid var(--accent)}
.ccard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ccard .nm{font-weight:600;font-size:1rem}
.tiles{display:flex;flex-wrap:wrap;gap:3px}
.tiles i{width:13px;height:13px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2)}
.tiles i.u{background:color-mix(in srgb,var(--accent) 70%,var(--surface));border-color:transparent}
.tiles i.l{background:var(--surface);border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.tiles i.debt{background:var(--bad-bg);border-color:var(--bad)}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.pinp{width:104px;text-align:right;padding:6px 8px}
.prices td{padding:6px 12px;vertical-align:middle}
.prices td.grp{padding-top:16px}

/* payments */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:52px minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.thumb{width:52px;height:64px;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2);cursor:zoom-in;padding:0}
.thumb span{font-size:10px;line-height:1.1;display:block;padding:2px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.amt{font-family:var(--f-mono);font-weight:500;text-align:right;white-space:nowrap}
.match{border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center}
.match.ok{background:var(--ok-bg)} .match.new{background:var(--warn-bg)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;color:var(--muted);font-size:.88rem}
.drop:hover{border-color:var(--accent)}
.drop img{width:56px;height:70px;object-fit:cover;border-radius:6px}

/* reports */
.rgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.chart{padding:12px 16px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:11px var(--f-mono)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b1{fill:var(--accent)} .chart .b2{fill:var(--rope)}
.chart .val{fill:var(--ink);font:600 11px var(--f-mono)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:10px 14px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}

/* login (cloud build) */
.app.auth .nav,.app.auth .tabbar,.app.auth .topbar .btn{display:none}
.login{max-width:420px;margin:8vh auto 0;overflow:hidden}
.login form .btn{align-self:flex-start}
.login .btn{min-height:44px}

/* plan */
.prose{max-width:72ch;display:flex;flex-direction:column;gap:12px;line-height:1.6}
.prose ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.sect{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.stack td:first-child{color:var(--muted)}
.stack td{white-space:normal;vertical-align:top}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-b{flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
.sheet-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line)}
.blockt{display:flex;flex-direction:column;gap:8px}
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}

/* ---------- views ---------- */
function vToday(){
  const now=new Date(),t=iso(now),mon=mondayOf(now);
  const todays=S.sessions.filter(s=>s.date===t).sort(byStart);
  const next=S.sessions.filter(s=>!s.cancelled&&endDT(s)>now).sort(byStart)[0];
  const wk=S.sessions.filter(s=>!s.cancelled&&startDT(s)>=mon&&endDT(s)<now&&Object.keys(s.att||{}).length);
  let pres=0,abs=0;wk.forEach(s=>Object.values(s.att).forEach(a=>a==='present'?pres+=attWeight(s):abs+=attWeight(s)));
  const mPaid=S.payments.filter(p=>{const d=pdate(p.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).reduce((a,p)=>a+p.amount,0);
  const todayLeft=todays.filter(s=>!s.cancelled&&endDT(s)>now).length;

    <div class="row"><button class="btn" data-act="test-push">${ic('bell')}Проверить напоминание</button><button class="btn primary" data-act="new-session">+ Занятие</button></div></div>
  <div class="stats">
    <div class="stat"><span class="eyebrow">Проведено за неделю</span><b>${wk.length}</b><span class="small muted">${plural(wk.length,'занятие','занятия','занятий')}</span></div>
    <div class="stat"><span class="eyebrow">Посещений</span><b>${pres}</b><span class="small muted">пропусков ${abs}</span></div>
    <div class="stat"><span class="eyebrow">Оплачено в ${MON_P[now.getMonth()]}</span><b>${money(mPaid)}</b><span class="small muted">${(n=>`${n} ${plural(n,'оплата','оплаты','оплат')}`)(S.payments.filter(p=>{const d=pdate(p.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length)}</span></div>
    <div class="stat"><span class="eyebrow">Нужна оплата</span><b>${S.clients.filter(c=>{const cs=clientStats(c.id);return cs.remaining<=1&&!trialOnly(cs)}).length}</b><span class="small muted">клиентов с остатком ≤ 1</span></div>
  </div>
  <div class="today">
    <div class="side-col">${next?nextCard(next):`<div class="panel empty">Запланированных занятий нет. <button class="btn sm" data-act="new-session">Добавить</button></div>`}
      <div class="panel"><div class="panel-h"><h2>Сегодня</h2><button class="btn sm ghost" data-act="nav" data-view="schedule">Вся неделя</button></div>
      ${todays.length?`<ul class="tl">${todays.map(tlItem).join('')}</ul>`:`<div class="empty">Свободный день. Нажмите «+ Занятие», чтобы добавить.</div>`}</div></div>
    <div class="side-col"><div class="panel"><div class="panel-h"><h2>Что сделать</h2><span class="small muted">${reminders().length}</span></div>
      <ul class="todo">${reminders().map(r=>`<li><span class="dot lv-${r.lv}"></span><div class="txt"><b>${r.title}</b><span class="small muted">${r.text}</span>${r.acts?`<div class="acts">${r.acts}</div>`:''}</div></li>`).join('')||'<li class="muted">Всё сделано.</li>'}</ul></div>${remPanel()}</div>
  </div>`;
}
function nextCard(s){

    <div class="row" style="justify-content:space-between"><span class="eyebrow">${st==='live'?'Идёт сейчас':'Следующее занятие'}</span><span class="when">${st==='live'?`до ${hm(endDT(s))}`:rel(startDT(s)-now)}</span></div>

function tlItem(s){const st=sStatus(s);
  return `<li><button data-act="open-session" data-id="${s.id}"><span class="t">${s.start}</span><span style="min-width:0;display:flex;flex-direction:column"><span class="nm">${esc(bTitle(s))}</span><span class="small muted">${TYPES[s.type].label} · ${esc(s.place)}</span></span><span class="chip st-${st}">${ST[st]}</span></button></li>`}
function reminders(){
  const now=new Date(),out=[];
  if(S.prices.length&&S.prices.every(t=>!t.one&&!t.p8&&!t.p10))out.push({lv:'warn',title:'Заполните прайс-лист',text:'Цены подставятся в оплаты. Тарифы можно добавлять свои.',acts:`<button class="btn sm" data-act="nav" data-view="plan">Открыть прайс</button>`});
  S.sessions.filter(s=>sStatus(s)==='unmarked'&&now-startDT(s)<14*864e5).sort(byStart).forEach(s=>out.push({lv:'warn',title:`Отметьте посещение: ${DAY[wd(pdate(s.date))]} ${fdateS(s.date)}, ${s.start}`,text:esc(sTitle(s)),acts:`<button class="btn sm" data-act="open-session" data-id="${s.id}">Отметить</button>`}));
  S.sessions.filter(s=>!s.cancelled&&startDT(s)>now&&startDT(s)-now<3*36e5).forEach(s=>out.push({lv:'ok',title:`${rel(startDT(s)-now)[0].toUpperCase()+rel(startDT(s)-now).slice(1)}: ${s.start}`,text:`${esc(sTitle(s))} · ${esc(s.place)}`}));
  S.clients.forEach(c=>{const cs=clientStats(c.id);if(trialOnly(cs))return;if(cs.remaining<=1&&cs.upcoming.length){
    out.push({lv:cs.remaining<=0?'bad':'warn',title:`${esc(c.name)}: ${remLabel(cs)}`,text:cs.firstUnpaid?`Первое неоплаченное занятие — ${fdateS(cs.firstUnpaid.date)}, ${cs.firstUnpaid.start}`:'Предложите продлить абонемент',
      acts:`<button class="btn sm" data-act="new-payment" data-cid="${c.id}">Добавить оплату</button><button class="btn sm ghost" data-act="copy-pay" data-cid="${c.id}">${ic('copy')}Текст о продлении</button>`})}
    else if(S.settings.warnExpiry&&cs.until&&cs.remaining>0&&pdate(cs.until)-now<7*864e5){
      const fit=cs.upcoming.filter(s=>s.date<=cs.until).length;
      out.push({lv:'warn',title:`${esc(c.name)}: абонемент до ${fdateS(cs.until)}`,text:`Осталось ${cs.remaining} ${plural(cs.remaining,'занятие','занятия','занятий')}, по расписанию успеет ${Math.min(fit,cs.remaining)}. Остальные сгорят.`,
        acts:`<button class="btn sm ghost" data-act="open-client" data-id="${c.id}">Карточка</button>`})}});
  S.sessions.filter(s=>s.kind==='trial'&&!s.cancelled&&startDT(s)>now&&startDT(s)-now<3*864e5).forEach(s=>{const c=client(s.clientIds[0]);if(!c)return;const tf=tariffOf(c);
    out.push({lv:'ok',title:`Пробное ${s.date===iso(now)?'сегодня':DAY[wd(pdate(s.date))]+' '+fdateS(s.date)}, ${s.start}: ${esc(c.name)}`,text:`После занятия предложите абонемент «${esc(tf.label)}»: ${[tf.p8?'8 занятий — '+money(tf.p8):'',tf.p10?'10 — '+money(tf.p10):''].filter(Boolean).join(', ')}`,acts:`<button class="btn sm ghost" data-act="open-session" data-id="${s.id}">Открыть</button>`})});
  const tm=S.sessions.filter(s=>s.date===iso(addDays(now,1))&&!s.cancelled);
  if(tm.length)out.push({lv:'ok',title:`Завтра ${tm.length} ${plural(tm.length,'занятие','занятия','занятий')}, первое в ${tm.sort(byStart)[0].start}`,text:tm.map(s=>`${s.start} ${esc(sTitle(s).split(' ·')[0])}`).join(' · ')});
  return out;
}

function vSchedule(){
  const now=new Date(),mon=addDays(mondayOf(now),UI.week*7),sun=addDays(mon,6);
  if(UI.selDay===null)UI.selDay=UI.week===0?wd(now):0;
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));
  const list=S.sessions.filter(s=>{const d=pdate(s.date);return d>=mon&&d<=sun});
  const H0=7,H1=22,HH=60;
  const title=mon.getMonth()===sun.getMonth()?`${mon.getDate()}–${sun.getDate()} ${MON[sun.getMonth()]}`:`${fdate(mon)} – ${fdate(sun)}`;
  const grid=`<div class="wgrid-wrap"><div class="wgrid" style="--hh:${HH}px">
    <div class="wh"></div>${days.map(d=>`<div class="wh ${iso(d)===iso(now)?'today':''}">${DAY[wd(d)]}<b>${d.getDate()}</b></div>`).join('')}
    <div class="hours" style="height:${(H1-H0)*HH}px">${[...Array(H1-H0)].map((_,i)=>i?`<span style="top:${i*HH}px">${pad(H0+i)}:00</span>`:'').join('')}</div>
    ${days.map(d=>{const di=iso(d),ss=list.filter(s=>s.date===di);
      const nl=di===iso(now)&&now.getHours()>=H0&&now.getHours()<H1?`<div class="nowline" style="top:${((now.getHours()-H0)*60+now.getMinutes())/60*HH}px"></div>`:'';
      return `<div class="dcol ${di===iso(now)?'today':''}" style="height:${(H1-H0)*HH}px" data-act="slot" data-date="${di}" title="Нажмите, чтобы добавить занятие">${nl}${ss.map(s=>{
        const [h,m]=s.start.split(':').map(Number),top=((h-H0)*60+m)/60*HH,ht=Math.max(28,s.dur/60*HH-3),st=sStatus(s);
        return `<button class="blk t-${s.type} ${st}" style="top:${top}px;height:${ht}px" data-act="open-session" data-id="${s.id}" aria-label="${s.start} ${esc(bTitle(s))}, ${ST[st]}">${st==='unmarked'?'<span class="flag"></span>':''}${ht<44?`<span class="bn"><span class="bt">${s.start}</span> ${esc(bTitle(s))}</span>`:`<span class="bt">${s.start}–${hm(endDT(s))}</span><span class="bn">${esc(bTitle(s))}</span>`}${ht>44?`<span class="small muted">${esc(s.place)}</span>`:''}</button>`}).join('')}</div>`}).join('')}
  </div></div>`;
  const sd=days[UI.selDay],sdl=list.filter(s=>s.date===iso(sd)).sort(byStart);
  const agenda=`<div class="agenda"><div class="dstrip">${days.map((d,i)=>{const n=list.filter(s=>s.date===iso(d));return `<button data-act="selday" data-i="${i}" aria-pressed="${i===UI.selDay}">${DAY[i]}<b>${d.getDate()}</b><span class="cnt">${n.slice(0,4).map(s=>`<i class="t-${s.type}"></i>`).join('')}</span></button>`}).join('')}</div>
    <div class="panel"><div class="panel-h"><h2>${DAYF[UI.selDay][0].toUpperCase()+DAYF[UI.selDay].slice(1)}, ${fdate(sd)}</h2><button class="btn sm" data-act="new-session" data-date="${iso(sd)}">+ Добавить</button></div>
    ${sdl.length?`<ul class="tl">${sdl.map(tlItem).join('')}</ul>`:'<div class="empty">В этот день занятий нет.</div>'}</div></div>`;
  return `<div class="page-head"><div><h1>Расписание</h1><p class="sub">${(n=>`${n} ${plural(n,'занятие','занятия','занятий')}`)(list.filter(s=>!s.cancelled).length)} на неделе · нажмите на пустое место, чтобы добавить</p></div>
    <div class="row"><div class="wk-nav"><button class="btn icon-btn" data-act="week" data-d="-1" aria-label="Прошлая неделя">${ic('left')}</button><span class="wk-title">${title}</span><button class="btn icon-btn" data-act="week" data-d="1" aria-label="Следующая неделя">${ic('right')}</button></div>
    ${UI.week!==0?'<button class="btn sm ghost" data-act="week" data-d="0">Эта неделя</button>':''}<button class="btn" data-act="vacation">Я не работаю</button><button class="btn primary" data-act="new-session">+ Занятие</button></div></div>
  <div class="legend">${Object.entries(TYPES).map(([k,v])=>`<span><i class="dot t-${k}"></i>${v.label}</span>`).join('')}<span><i class="dot st-unmarked"></i>Не отмечено посещение</span></div>
  ${grid}${agenda}`;
}

function vClients(){
  return `<div class="page-head"><div><h1>Клиенты</h1><p class="sub">${S.clients.length} ${plural(S.clients.length,'клиент','клиента','клиентов')} · ${S.groups.length} ${plural(S.groups.length,'группа','группы','групп')}</p></div><div class="row"><button class="btn" data-act="new-group">+ Группа</button><button class="btn primary" data-act="new-client">+ Клиент</button></div></div>

  <div class="clist" id="clist">${clientList()}</div>`;

function clientList(){
  const q=UI.cQuery.toLowerCase(),qd=digits(q);
  const list=S.clients.filter(c=>{if(UI.cFilter==='due')return clientStats(c.id).remaining<=1;if(UI.cFilter!=='all'&&c.kind!==UI.cFilter)return false;
    return !q||c.name.toLowerCase().includes(q)||(c.parent||'').toLowerCase().includes(q)||(qd.length>2&&digits(c.phone).includes(qd))});
  if(!list.length)return '<div class="card empty" style="grid-column:1/-1">Никого не нашли. Проверьте написание или добавьте клиента.</div>';

    return `<button class="ccard" data-act="open-client" data-id="${c.id}"><div class="top"><div style="min-width:0"><div class="nm">${esc(c.name)}</div><div class="small muted">${KINDS[c.kind]} · ${esc(c.age)}${c.parent?` · ${esc(c.parent)}`:''}</div></div>${c.pause&&c.pause.to>=iso(new Date())?`<span class="chip st-paused">Пауза до ${fdateS(c.pause.to)}</span>`:''}<span class="chip lv-${cs.lv}">${cs.remaining<=0?(cs.remaining<0?'Долг':'Оплатить'):`Осталось ${cs.remaining}`}</span></div>
      ${tiles(cs)}<div class="kv"><span>Прошло <b>${cs.used}</b></span><span>Пропусков <b>${cs.absent+cs.excused}</b></span><span class="mono">${esc(c.phone)}</span><span>${esc(tariffOf(c).label)}</span></div></button>`}).join('');

function tiles(cs){const left=Math.max(0,cs.remaining),cap=Math.min(cs.aUsed+left+cs.debt,24);let h='';
  for(let i=0;i<cap;i++)h+=`<i class="${i<cs.aUsed?'u':i<cs.aUsed+left?'l':'debt'}"></i>`;
  return `<div class="tiles" title="Закрашено — прошло, контур — осталось">${h||'<span class="small muted">Оплат пока нет</span>'}</div>`}

function vPayments(){

function payList(){
  const q=UI.pQuery.toLowerCase(),qd=digits(q);
  const list=[...S.payments].sort((a,b)=>b.date.localeCompare(a.date)).filter(p=>{const c=client(p.clientId),w=client(p.with);

    <button class="thumb" data-act="view-receipt" data-id="${p.id}" aria-label="Открыть оплату">${p.img?`<img src="${esc(p.img)}" alt="">`:`<span class="small muted">${p.imgSentAt?'в Telegram':'без фото'}</span>`}</button>
    <div style="min-width:0"><button class="btn ghost" style="padding:0;font-weight:600;color:var(--ink);white-space:normal;text-align:left" data-act="open-client" data-id="${p.clientId}">${esc(c?.name||'Без клиента')}${w?` + ${esc(w.name.split(' ')[0])}`:''}</button><div class="small muted mono">${esc(p.phone)}</div></div>
    <div class="pmeta small muted">${t?esc(t.label):'Без тарифа'}<br>${fdateS(p.date)} · ${esc(p.method)} · ${p.sessions===1?'разовое':`${p.sessions} ${plural(p.sessions,'занятие','занятия','занятий')}`}${p.until?` · до ${fdateS(p.until)}`:''}</div>
    <div class="amt">${money(p.amount)}</div></div>`}).join('');

function inPeriod(s){const now=new Date();const d=startDT(s);
  if(UI.period==='week')return d>=mondayOf(now);
  if(UI.period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return true}
function payInPeriod(p){const now=new Date(),d=pdate(p.date);if(UI.period==='week')return d>=mondayOf(now);if(UI.period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return true}
function vReports(){
  const now=new Date();
  const past=S.sessions.filter(s=>!s.cancelled&&endDT(s)<now&&(UI.rType==='all'||s.type===UI.rType));
  const per=past.filter(inPeriod);
  const cnt=(arr,v)=>arr.reduce((a,s)=>a+Object.values(s.att).filter(x=>x===v).length*attWeight(s),0);
  const pres=cnt(per,'present'),abs=cnt(per,'absent'),exc=cnt(per,'excused');
  const upcoming=S.sessions.filter(s=>!s.cancelled&&startDT(s)>now&&(UI.rType==='all'||s.type===UI.rType)&&(UI.period==='week'?startDT(s)<addDays(mondayOf(now),7):UI.period==='month'?startDT(s).getMonth()===now.getMonth():true));
  const remaining=S.clients.reduce((a,c)=>a+Math.max(0,clientStats(c.id).remaining),0);
  const pays=S.payments.filter(payInPeriod),revenue=pays.reduce((a,p)=>a+p.amount,0);
  const byTar=S.prices.map(t=>{const ps=pays.filter(p=>p.tariff===t.id);return {t,n:ps.length,s:ps.reduce((a,p)=>a+p.amount,0)}}).filter(x=>x.n).sort((a,b)=>b.s-a.s);
  const weeks=[...Array(6)].map((_,i)=>{const m=addDays(mondayOf(now),(i-5)*7),e=addDays(m,7);const ss=past.filter(s=>startDT(s)>=m&&startDT(s)<e);return {m,p:cnt(ss,'present'),a:cnt(ss,'absent')+cnt(ss,'excused')}});

function chart(w){
  const W=600,H=220,L=34,B=28,T=14,max=Math.max(4,...w.map(x=>x.p+x.a));const step=max<=8?2:max<=20?5:max<=40?10:20;const top=Math.ceil(max/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-10)/w.length;
  let g='';for(let v=0;v<=top;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=w.map((x,i)=>{const cx=L+bw*i+bw*.2,bwd=bw*.6;return `<rect class="b1" x="${cx}" y="${y(x.p)}" width="${bwd}" height="${y(0)-y(x.p)}" rx="3"/><rect class="b2" x="${cx}" y="${y(x.p+x.a)}" width="${bwd}" height="${Math.max(0,y(x.p)-y(x.p+x.a)-2)}" rx="3"/>
    ${x.p+x.a?`<text class="val" x="${cx+bwd/2}" y="${y(x.p+x.a)-5}" text-anchor="middle">${x.p}</text>`:''}<text class="ax" x="${cx+bwd/2}" y="${H-8}" text-anchor="middle">${x.m.getDate()}.${pad(x.m.getMonth()+1)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Посещения и пропуски за последние 6 недель">${g}${bars}</svg>`;
}

function openSheet(html,key){const sh=document.getElementById('sheet');const keep=UI.openSheet===key?sh.querySelector('.sheet-b')?.scrollTop:0;

      :`<p class="small muted">На время болезни или отъезда: занятия за эти дни не списываются, бот о них не напоминает, место в группе сохраняется.</p>

  if(list.length>1)return `<div class="match ok" style="flex-direction:column;align-items:stretch;gap:6px"><span class="small">На этот номер записаны ${list.length} ${plural(list.length,'клиент','клиента','клиентов')}. За кого чек?</span>${list.map((c,i)=>`<label style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="radio" name="cid" value="${c.id}" ${(sel?c.id===sel:i===0)?'checked':''}><b>${esc(c.name)}</b><span class="small muted">${remLabel(clientStats(c.id))}</span></label>`).join('')}</div>`;

/* ---------- reading a Kaspi receipt (on the device, tesseract.js) ---------- */
let tessLoading=null;
function loadTesseract(){if(window.Tesseract)return Promise.resolve();
  return tessLoading||(tessLoading=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.integrity='sha384-GJqSu7vueQ9qN0E9yLPb3Wtpd7OrgK8KmYzC8T1IysG1bcvxvIO4qtYR/D3A991F';s.crossOrigin='anonymous';s.onload=ok;s.onerror=()=>{tessLoading=null;no(new Error('load'))};document.head.appendChild(s)}))}
function parseReceipt(text){
  const PHONE=/(?:\+7|8|(?<!\d)7(?=[\s(-]))[\s(-]*(7\d{2})[\s)-]*(\d{3})[\s-]*(\d{2})[\s-]*(\d{2})/;
  const raw=String(text).replace(/[\u00a0\u202f\u2009]/g,' '),p=raw.match(PHONE),t=raw.replace(new RegExp(PHONE.source,'g'),' ');
  // OCR often reads ₸ as a lone «т» or «T».
  const money=[...t.matchAll(/(\d{1,3}(?:[ .]\d{3})+|\d{3,7})(?:,\d{1,2})?\s*(?:₸|тг|тенге|〒|[тТT](?![А-Яа-яA-Za-z]))/g)].map(m=>+m[1].replace(/[ .]/g,''));
  let amount=money.length?Math.max(...money):null;
  if(!amount){const m=t.match(/(?:сумма|итого|оплачено|перевод)[^\d\n]{0,20}(\d{1,3}(?: \d{3})+|\d{3,7})/i);if(m)amount=+m[1].replace(/ /g,'')}
  if(!amount){const g=[...t.matchAll(/(?<![\d.:])(\d{1,3}(?: \d{3})+)(?![\d.:])/g)].map(m=>+m[1].replace(/ /g,''));if(g.length)amount=Math.max(...g)}
  const d=t.match(/(\d{2})[.\/](\d{2})[.\/](\d{4})/);
  return {amount,date:d?`${d[3]}-${d[2]}-${d[1]}`:null,phone:p?`+7 ${p[1]} ${p[2]} ${p[3]} ${p[4]}`:null};
}
// Several tariffs can cost the same; the one already chosen for the client wins.
function matchTariff(amount,prefer){
  const list=[...S.prices].sort((a,b)=>(b.id===prefer)-(a.id===prefer));
  for(const t of list)for(const n of [1,8,10]){const f=n===1?'one':'p'+n;if(!t[f])continue;
    if(priceFor(t,n)===amount)return {t,n,two:false};if(t.id==='family'&&priceFor(t,n)*2===amount)return {t,n,two:true}}
  return null;
}
async function readReceipt(img){
  const box=document.getElementById('np-ocr');if(!box)return;box.hidden=false;box.textContent='Читаю чек…';
  try{
    await loadTesseract();const r=await Tesseract.recognize(img,'rus+eng');
    if(!document.getElementById('f-pay'))return;
    const f=parseReceipt(r.data.text),got=[];
    if(f.phone){const i=document.getElementById('np-phone');if(digits(i.value).length<10){i.value=f.phone;i.dispatchEvent(new Event('input',{bubbles:true}))}got.push(f.phone)}
    if(f.date){document.getElementById('np-date').value=f.date;got.push(fdateS(f.date))}
    if(!f.amount){box.textContent=got.length?`С чека: ${got.join(', ')}. Сумму не нашёл — впишите её сами.`:'Не получилось прочитать чек. Заполните поля вручную.';return}
    got.push(money(f.amount));
    const m=matchTariff(f.amount,document.getElementById('np-tariff')?.value||client(curCid())?.tariff);
    if(m){setPayTariff(m.t,curCid(),false);document.getElementById('np-sessions').value=m.n;
      const w=document.getElementById('np-with');if(w&&m.t.id==='family'&&!m.two)w.value='';recalcAmount()}
    document.getElementById('np-amount').value=f.amount;
    box.innerHTML=`С чека: ${got.join(', ')}. `+(m?`Похоже на «${esc(m.t.label)}», ${m.n===1?'разовое':m.n+' занятий'}${m.two?' за двоих':''}. Проверьте поля.`:'<b style="color:var(--warn)">Сумма не совпадает с прайсом</b> — возможно, скидка. Проверьте тариф.');
  }catch(e){box.textContent='Не получилось прочитать чек. Заполните поля вручную.'}
}

/* ---------- income by month ---------- */
const MON_S=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function revenueData(){
  const now=new Date(),months=[...Array(12)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-11+i,1);return {y:d.getFullYear(),m:d.getMonth(),sum:0,n:0,newC:0}});
  const key=(y,m)=>y*12+m,idx=new Map(months.map((x,i)=>[key(x.y,x.m),i])),seen=new Set(),types={};
  [...S.payments].sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{const d=pdate(p.date),i=idx.get(key(d.getFullYear(),d.getMonth()));
    [p.clientId,p.with].filter(Boolean).forEach(c=>{if(!seen.has(c)){seen.add(c);if(i!=null)months[i].newC++}});
    if(i==null)return;months[i].sum+=p.amount;months[i].n++;const k=tariff(p.tariff)?.type||'other';types[k]=(types[k]||0)+p.amount});
  return {months,types};
}
function revenueHTML(){
  const {months,types}=revenueData(),cur=months[11],prev=months[10];
  const diff=prev.sum?Math.round((cur.sum-prev.sum)/prev.sum*100):null;
  const tot=months.reduce((a,x)=>a+x.sum,0),cnt=months.reduce((a,x)=>a+x.n,0);
  const W=600,H=200,L=44,B=26,T=14,max=Math.max(1,...months.map(x=>x.sum));
  const step=[10000,20000,50000,100000,200000,500000,1000000,2000000,5000000].find(s=>max/s<=5)||10000000,top=Math.ceil(max/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-8)/12,k=v=>v>=1e6?(v/1e6).toLocaleString('ru-RU')+' млн':v>=1000?Math.round(v/1000)+'к':String(v);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${k(v)}</text>`;
  const bars=months.map((x,i)=>{const cx=L+bw*i+bw*.18,w=bw*.64;return `<rect class="b1" x="${cx}" y="${y(x.sum)}" width="${w}" height="${Math.max(0,y(0)-y(x.sum))}" rx="3" ${i===11?'':'opacity=".55"'}/>${x.sum&&i>=9?`<text class="val" x="${cx+w/2}" y="${y(x.sum)-5}" text-anchor="middle">${k(x.sum)}</text>`:''}<text class="ax" x="${cx+w/2}" y="${H-7}" text-anchor="middle">${MON_S[x.m]}</text>`}).join('');
  const typeRows=Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([t,s])=>`<span class="row" style="gap:6px"><span class="chip t-${t}">${TYPES[t]?.label||'Без тарифа'}</span><span class="mono small">${money(s)}</span></span>`).join('');
  return `<div class="panel" style="margin-bottom:20px"><div class="panel-h"><h2>Доход по месяцам</h2><button class="btn sm ghost" data-act="copy-revenue">${ic('copy')}Для Excel</button></div>
    <div class="stats" style="border:0;border-radius:0;margin:0;border-bottom:1px solid var(--line)">
      <div class="stat"><span class="eyebrow">В ${MON_P[cur.m]}</span><b>${money(cur.sum)}</b><span class="small muted">${diff===null?'в прошлом месяце оплат не было':`${diff>=0?'+':''}${diff}% к ${MON_S[prev.m]}`}</span></div>
      <div class="stat"><span class="eyebrow">За 12 месяцев</span><b>${money(tot)}</b><span class="small muted">${cnt} ${plural(cnt,'оплата','оплаты','оплат')}</span></div>
      <div class="stat"><span class="eyebrow">Средний чек</span><b>${money(cnt?tot/cnt:0)}</b><span class="small muted">за 12 месяцев</span></div>
      <div class="stat"><span class="eyebrow">Новых клиентов</span><b>${cur.newC}</b><span class="small muted">в ${MON_P[cur.m]}, в ${MON_P[prev.m]} — ${prev.newC}</span></div></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Доход по месяцам за год">${g}${bars}</svg></div>
    <div class="row" style="padding:0 16px 14px;gap:8px 14px">${typeRows||'<span class="small muted">Оплат пока нет</span>'}</div></div>`;
}

/* ---------- live reminders: fire while the service is open ---------- */
const LEAD={'30m':30,'2h':120,'1d':1440},LEADL={'30m':'за 30 мин','2h':'за 2 часа','1d':'за сутки'};
const NKEY='dorozhka-notified-v1';
let notified={};try{notified=JSON.parse(localStorage.getItem(NKEY)||'{}')||{}}catch(e){}
function markNotified(k){notified[k]=Date.now();try{localStorage.setItem(NKEY,JSON.stringify(notified))}catch(e){}}
let audioCtx=null;
document.addEventListener('pointerdown',()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function chime(){try{if(!audioCtx)return;const t0=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';
  o.frequency.setValueAtTime(880,t0);o.frequency.setValueAtTime(660,t0+.16);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.2,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.55);
  o.connect(g).connect(audioCtx.destination);o.start(t0);o.stop(t0+.6)}catch(e){}}
function notify(title,text,sid){toast(title,text,{sticky:true,sid});chime();try{if(navigator.vibrate&&navigator.userActivation?.hasBeenActive)navigator.vibrate([120,60,120])}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title.replace(/<[^>]+>/g,''),{body:text.replace(/<[^>]+>/g,'')})}catch(e){}}
const shortTitle=s=>(s.kind?SKIND[s.kind]+' ':'')+sTitle(s).split(' ·')[0];
function remindSession(s,now){const st=startDT(s),pn=prevNote(s);
  notify(`${rel(st-now)[0].toUpperCase()+rel(st-now).slice(1)}: ${s.start} · ${esc(shortTitle(s))}`,`${TYPES[s.type].label}, ${esc(s.place)}${pn?`. С прошлого раза: ${esc(pn.next)}`:''}`,s.id)}
function checkReminders(){
  const now=new Date(),lead=(LEAD[S.settings.remindCoach]||120)*60000,due=[];
  for(const s of S.sessions){if(s.cancelled||!activeIds(s).length)continue;const st=startDT(s),k=`${s.id}:${s.date}T${s.start}:${S.settings.remindCoach}`;
    // The key carries the time, so a moved session is reminded again (keys without it were saved before this rule).
    if(now>=st-lead&&now<st&&!notified[k]&&!notified[s.id+':'+S.settings.remindCoach]){markNotified(k);due.push(s)}}
  due.sort(byStart);
  if(due.length>2)notify(`Скоро ${due.length} ${plural(due.length,'занятие','занятия','занятий')}`,due.map(s=>`${s.start} ${esc(shortTitle(s))}`).join(', '));
  else due.forEach(s=>remindSession(s,now));
  const dk='digest:'+iso(now);let dg=false;
  if(S.settings.morningDigest&&now.getHours()>=7&&!notified[dk]){markNotified(dk);dg=true;
    const td=S.sessions.filter(s=>s.date===iso(now)&&!s.cancelled).sort(byStart);
    const pay=S.clients.filter(c=>{const cs=clientStats(c.id);return cs.remaining<=1&&!trialOnly(cs)&&cs.upcoming.length});
    notify('Сводка дня',`${td.length?td.map(s=>`${s.start} ${esc(shortTitle(s))}`).join(', '):'Сегодня занятий нет'}${pay.length?`. Нужна оплата: ${pay.map(c=>esc(c.name.split(' ')[0])).join(', ')}`:''}`)}
  if((due.length||dg)&&UI.view==='today'&&!UI.openSheet)render();
}
function remPanel(){
  const now=new Date(),lead=(LEAD[S.settings.remindCoach]||120)*60000;
  const list=S.sessions.filter(s=>!s.cancelled&&activeIds(s).length&&startDT(s)>now).sort(byStart).slice(0,5);
  const perm='Notification' in window?Notification.permission:'unsupported';
  return `<div class="panel"><div class="panel-h"><h2>Напоминания</h2><span class="small muted">${LEADL[S.settings.remindCoach]||'за 2 часа'} до занятия</span></div>
    <ul class="tl">${list.map(s=>{const at=new Date(startDT(s)-lead),sent=notified[s.id+':'+S.settings.remindCoach];

async function api(method,url,body){
  // Every write is JSON, even without a body: the server refuses other content types (CSRF protection).
  const r=await fetch(url,{method,headers:method==='GET'?{}:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!(r.headers.get('content-type')||'').includes('json')){const e=new Error('Сервер не отвечает');e.status=r.status;throw e}
  const j=await r.json();if(!r.ok){const e=new Error(j.error||('Ошибка '+r.status));e.status=r.status;e.body=j;throw e}return j}

    return api('GET','/api/state')},
  async save(version,state){if(!CLOUD)return api('PUT','/api/state',{version,state});
    const {data,error}=await sb.rpc('save_state',{expected:version,new_data:state});if(error)throw new Error(error.message);
    const r=data[0];if(r.is_conflict){const e=new Error('conflict');e.status=409;e.body={version:r.new_version,state:r.current_data};throw e}return {version:r.new_version}},
  async tg(action,body){
    if(!CLOUD){const [m,u]={status:['GET','/api/telegram'],connect:['POST','/api/telegram'],test:['POST','/api/telegram/test'],disconnect:['DELETE','/api/telegram']}[action];return api(m,u,body)}
    if(action!=='status'&&action!=='test')throw new Error('В облаке бот общий, подключать его не нужно');
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${CLOUD.url}/functions/v1/telegram/${action}`,{method:'POST',headers:{'content-type':'application/json',apikey:CLOUD.anonKey,authorization:'Bearer '+(session?.access_token||'')},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Ошибка '+r.status));return j}
};

async function tgLoginPoll(p){
  if(LOGIN.busy)return;const msg=document.getElementById('lg-msg');

  // Pick up changes made elsewhere (Telegram buttons, another device) while nothing is being edited here.
  if(SERVER.on)setInterval(async()=>{if(SERVER.dirty||SERVER.timer||UI.openSheet||document.hidden)return;
    try{const j=await BE.load();if(j.version>SERVER.version&&j.state&&!SERVER.dirty&&!SERVER.timer){S=j.state;SERVER.base=structuredClone(j.state);SERVER.version=j.version;render()}}catch(e){}},15000);
}
boot();
</script>
